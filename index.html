<style>
  :root{--bg:#0e1116;--card:#161b22;--line:#2a3038;--tx:#e6edf3;--tx2:#9da7b3;--ac:#4f9dff;--ac2:#7ee787;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 80px;}
  h1{font-size:1.4rem;text-align:center;margin:12px 0 24px;}
  .src-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px;}
  .src-btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 10px;text-align:center;cursor:pointer;font-size:1.05rem;font-weight:700;color:var(--tx);}
  .src-btn.active{border-color:var(--ac);box-shadow:0 0 0 2px rgba(79,157,255,.25) inset;}
  .src-btn .sub{display:block;margin-top:6px;font-size:.75rem;font-weight:400;color:var(--tx2);}
  .year-group{margin-bottom:18px;}
  .year-title{font-size:.85rem;color:var(--tx2);font-weight:700;margin:14px 0 8px;padding-left:2px;}
  .round-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .round-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .round-name{font-weight:700;font-size:.95rem;}
  .round-count{font-size:.75rem;color:var(--tx2);}
  .round-body{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .round-body.open{display:block;}
  .mode-row{display:flex;flex-direction:column;gap:8px;}
  .mode-btn{display:block;width:100%;text-align:left;background:#1c232c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--tx);text-decoration:none;font-size:.85rem;}
  .mode-btn b{display:block;font-size:.9rem;margin-bottom:2px;}
  .mode-btn .d{color:var(--tx2);font-size:.75rem;}
  .subj-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .subj-chip{background:#1c232c;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.78rem;color:var(--tx);text-decoration:none;}
  .subj-chip:active{background:var(--ac);color:#fff;}
  .empty{text-align:center;color:var(--tx2);padding:40px 0;}
</style>
</head>

const SOURCES = Object.keys(MANIFEST);
let currentSource = SOURCES[0] || null;

function groupByYear(rounds){
  const groups = {};
  rounds.forEach(r=>{
    const m = r.title.match(/(\d{4})/);
    const y = m ? m[1] : '기타';
    (groups[y] = groups[y] || []).push(r);
  });
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(y=>({year:y, rounds:groups[y]}));
}

function renderSrcGrid(){
  const el = document.getElementById('srcGrid');
  el.innerHTML = SOURCES.map(s=>`
    <div class="src-btn ${s===currentSource?'active':''}" onclick="selectSource('${s}')">
      ${s}
      <span class="sub">${MANIFEST[s].length}개 회차</span>
    </div>`).join('');
}

function selectSource(s){
  currentSource = s;
  renderSrcGrid();
  renderRoundList();
}

function toggleRound(id){
  const body = document.getElementById(id);
  body.classList.toggle('open');
}

        const file = r.file;
        const subjChips = r.subjects.map(s=>
          `<a class="subj-chip" href="${encodeURI(file)}?subject=${encodeURIComponent(s)}">${s}</a>`
        ).join('');
        return `
        <div class="round-card">
          <div class="round-head" onclick="toggleRound('${bodyId}')">
            <span class="round-name">${r.title}</span>
            <span class="round-count">${r.count}문제 ▾</span>
          </div>
          <div class="round-body" id="${bodyId}">
            <div class="mode-row">
              <a class="mode-btn" href="${encodeURI(file)}">
                <b>전체 문제 풀기</b><span class="d">회차 전체를 순서대로</span>
              </a>
              <a class="mode-btn" href="${encodeURI(file)}?mode=study">
                <b>학습모드</b><span class="d">정답·해설이 처음부터 보임</span>
              </a>
            </div>
            ${subjChips ? `<div class="year-title" style="margin-top:12px;">과목별로 몰아풀기</div><div class="subj-list">${subjChips}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>`).join('');
}

renderSrcGrid();
renderRoundList();
</script>
</body>
</html>
