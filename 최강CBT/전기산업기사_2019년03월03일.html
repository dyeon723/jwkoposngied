<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전기산업기사 2019년03월03일</title><!-- ★ 제목 수정 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#0d0f18; --sf:#161929; --sf2:#1d2035; --bd:#272b42;
  --ac:#5b9cf6; --ac2:#f5c842; --ok:#3ecf8e; --ng:#f05a5a;
  --tx:#e4e8f5; --tx2:#8e97be; --tx3:#5a6285;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}

/* ── 헤더 (컴팩트) ── */
.hd{
  background:linear-gradient(135deg,#161929,#0d0f18);
  border-bottom:2px solid var(--ac);
  padding:8px 14px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:10px;
}
.hd-title{font-size:.95rem;font-weight:900;color:var(--ac);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}

/* 진도 칩 */
.progress-chip{
  font-size:.68rem;font-weight:700;
  background:var(--sf2);border:1px solid var(--bd);
  border-radius:20px;padding:3px 9px;
  color:var(--tx2);white-space:nowrap;
}
.progress-chip span{color:var(--ac);}

/* 통계/필터 버튼 */
.stat-btn{
  display:flex;align-items:center;gap:3px;
  background:var(--sf2);border:1px solid var(--bd);border-radius:20px;
  padding:3px 9px;font-size:.68rem;font-weight:700;
  cursor:pointer;transition:all .2s;user-select:none;white-space:nowrap;
  color:var(--tx2);
}
@media(hover:hover){.stat-btn:hover{filter:brightness(1.2);}}
.stat-btn .lbl{font-weight:700;}
#btnAll.on{border-color:var(--ac);background:rgba(91,156,246,.15);color:var(--ac);}#btnNg.on{border-color:var(--ng);background:rgba(240,90,90,.12);color:var(--ng);}
#btnWeak.on{border-color:#f5963a;background:rgba(245,150,50,.12);color:#f5963a;}

/* 자주 틀림 드롭다운 */
.weak-wrap{position:relative;}
.weak-menu{
  display:none;position:absolute;top:calc(100% + 6px);right:0;
  background:var(--sf);border:1px solid var(--bd);border-radius:10px;

    ans: 3,
    e: `<div style="color:var(--tx3);font-size:.75rem;font-weight:700;margin-bottom:6px;">정답률 56%</div>전력을 구하는 것이니<br>P=RI^2을 사용<br>문제에 제시된 내용들에는 저항의 값만 나와있으므로<br>전류값을 별도로 구해주도록 한다.<br>전류 I=V/Z, 200/루트(6^2x8^2)을<br>해주게 되면 20이 나오게 되고 위의 공식에 적용하면<br>P=6x20^2=2400W가 나오게 된다.<br>하지만 여기서 끝나지 않고 문제에서 요구하는 단위는<br>KW로 명시되어 있으므로 이 사실을 적용해주면<br>2400x10^-3=2.4KW가 답이되게된다.<br>[해설작성자 : 아잉]<br>유효전력 P = V I Cos$ = I^2 * R = ( V^2 * R ) / R^2 + XL^2 중 에서<br>전압 저항 리액턴스 만 나왔으므로 3번째 식을 사용합니다.<br>P = ( V^2 * R ) / R^2 + XL^2 = ( 200^2 * 6) / 6^2 + 8^2 = 2400 (W) = 2.4 (KW)<br>여기서, V = 200루트2 / 루트 2<br>[해설작성자 : 코로나 조심]<br>이 문제는 역률을 구할 수 있기에 VICOS@ 로 풀어낼 수 있습니다.<br>우선 V를 실효값으로 바꿔주면 200, 임피던스는 10 그러므로 전류는 20 <br>역률은 저항/임피던스 = 6/10 = 0.6 <br>200 * 20 * 0.6 = 2400 = 2.4kW<br>[해설작성자 : 용산철도고 현자]<br>P[kW] = R * V^2 / R^2 + XL^2 ▶ 6 * 200^2 / 6^2 + 8^2 = 2.4[kW]<br>[해설작성자 : 따고싶다 or 어디든 빌런]`

/* ── 상수 ── */
const N = ['①','②','③','④'];
const KATEX_OPTS = {
  delimiters:[{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
  throwOnError:false
};
const STORE_KEY = 'egki_' + document.title.replace(/\s/g,'_');

/* ── 상태 변수 ── */
let wrongSet    = new Set();
let okSet       = new Set();
let bookmarkSet = new Set();
let shufMap     = {};
let selectedMap = {};
let attemptMap  = {};  /* attemptMap[n] = {try, ok} */
let randMode    = false;
let randedOrder = null;  /* 섞인 문제 순서 저장 */
let shufMode    = false;
let bmMode      = false;
let viewMode    = 'all';
let weakPctActive = null;
let lastSeenN   = null;

function shuf(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* 시도 비율 → CSS 클래스 */
function atCls(at){
  if(!at||at.try===0) return 'tg-at-none';
  const r=at.ok/at.try;
  if(r<0.2)  return 'tg-at-zero';
  if(r<0.5)  return 'tg-at-low';
  if(r<0.8)  return 'tg-at-mid';
  return 'tg-at-full';
}
function atHtml(at){
  const cls=atCls(at);
  const txt=at?`${at.ok}/${at.try}`:'-/-';
  return `<span class="tg tg-at ${cls}">${txt}</span>`;
}

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      wrongSet:[...wrongSet],
      okSet:[...okSet],
      selectedMap,
      attemptMap,
      bookmarkSet:[...bookmarkSet],
      lastN: lastSeenN
    }));
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s=JSON.parse(raw);
    const validNs=new Set(QS.filter(q=>q.n!=null).map(q=>q.n));
    wrongSet   = new Set((s.wrongSet||[]).filter(n=>validNs.has(n)));
    okSet      = new Set((s.okSet||[]).filter(n=>validNs.has(n)));
    bookmarkSet= new Set((s.bookmarkSet||[]).filter(n=>validNs.has(n)));
    selectedMap= Object.fromEntries(Object.entries(s.selectedMap||{}).filter(([k])=>validNs.has(parseInt(k))));
    const am=s.attemptMap||{};
    Object.keys(am).filter(k=>validNs.has(parseInt(k))).forEach(k=>{ attemptMap[parseInt(k)]=am[k]; });
    lastSeenN  = validNs.has(s.lastN)?s.lastN:null;
  }catch(e){}
}

/* 통계 업데이트 */
function upStat(){
  const done=okSet.size+wrongSet.size;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-total').textContent=QS.length;
}

/* 전체 렌더 (DOM 재구성) */
function render(){
  let qs = randedOrder
    ? randedOrder.map(n=>QS.find(q=>q.n===n)).filter(Boolean)
    : QS.filter(q=>q.n!=null);
  document.getElementById('main').innerHTML=qs.map(mkCard).join('');
  renderMathInElement(document.getElementById('main'),KATEX_OPTS);
  if(viewMode!=='all') applyViewFilter(viewMode, weakPctActive);
  upStat();
}

/* ── 뷰 필터 ── */

/* 순수 DOM show/hide — alert 없음, render()에서 내부 호출용 */
function applyViewFilter(mode, weakPct){
  document.querySelectorAll('.card').forEach(c=>{
    const n=parseInt(c.dataset.n);
    let show=true;
    if(mode==='ok')   show=okSet.has(n);
    if(mode==='ng')   show=wrongSet.has(n);
    if(mode==='bm')   show=bookmarkSet.has(n);
    if(mode==='weak'){
      const at=attemptMap[n];
      show=!!at&&at.try>0&&(at.ok/at.try*100)<=weakPct;
    }
    c.style.display=show?'':'none';
  });
  /* 오답 뷰: 카드를 초기화해 다시 풀 수 있게 */
  if(mode==='ng'){
    wrongSet.forEach(n=>{
      const card=document.getElementById('q'+n);
      if(!card) return;
      card.querySelectorAll('.opt').forEach(o=>o.className='opt');
      const res=document.getElementById(`q${n}_res`);
      if(res) res.classList.remove('show');
      card.className='card answered-ng';
      const cn=card.querySelector('.cn');
      if(cn) cn.className='cn ng';
    });
  }
}

/* 버튼 강조 업데이트 */
function updateViewBtns(mode, weakPct){
  ['btnAll','btnNg','btnWeak'].forEach(id=>document.getElementById(id).classList.remove('on'));
  if(mode==='all')        document.getElementById('btnAll').classList.add('on');
  else if(mode==='ng')    document.getElementById('btnNg').classList.add('on');
  else if(mode==='weak'){
    document.getElementById('btnWeak').classList.add('on');
    document.querySelector('#btnWeak .lbl').textContent=`≤${weakPct}%`;
  }
}

/* 사용자 클릭 진입점 — 검증 + 상태 저장 + 필터 적용 */
function setView(mode, weakPct){
  document.getElementById('weakMenu').classList.remove('open');
  /* 빈 상태 경고 */
  if(mode==='ok'   && okSet.size===0)   {alert('아직 맞힌 문제가 없어요!');return;}
  if(mode==='ng'   && wrongSet.size===0){alert('아직 틀린 문제가 없어요!');return;}
  if(mode==='weak'){
    const has=QS.some(q=>{const at=attemptMap[q.n];return at&&at.try>0&&(at.ok/at.try*100)<=weakPct;});
    if(!has){alert(`정확률 ${weakPct}% 이하인 문제가 없어요! 먼저 풀어보세요 😊`);return;}
  }
  viewMode=mode;
  weakPctActive=(mode==='weak')?weakPct:null;
  updateViewBtns(mode, weakPct);
  applyViewFilter(mode, weakPct);
}

  document.getElementById('weakMenu').classList.toggle('open');

document.addEventListener('click', e=>{

/* ── 카드 생성 ── */
function mkCard(q){
  const id='q'+q.n;
  const isOk=okSet.has(q.n),isNg=wrongSet.has(q.n);
  const answered=STUDY_MODE||isOk||isNg;
  const tags=``;
  const at=attemptMap[q.n];
  const atTag=atHtml(at);

  let opts=[...q.o],dispAns=q.ans;
  if(shufMode){
    if(!shufMap[id]){const sh=shuf([0,1,2,3]);shufMap[id]={order:sh,newAns:sh.indexOf(q.ans-1)+1};}
    opts=shufMap[id].order.map(i=>q.o[i]);dispAns=shufMap[id].newAns;
  }

  const savedSel=selectedMap[q.n]?.sel??null;

  const optHtml=opts.map((o,i)=>{
    const pos=i+1;
    let cls='opt';
    if(answered){
      cls+=' lk';
      if(pos===dispAns) cls+=' cor';
      if(savedSel!==null && pos===savedSel && savedSel!==dispAns) cls+=' wrg';
    }
    return `<div class="${cls}" id="${id}_p${pos}" onclick="sel('${id}',${pos},${dispAns})">
      <span class="on">${N[i]}</span><span>${o}</span>
    </div>`;
  }).join('');

  const resShow=answered?'show':'';
  const aeHtml=q.ae?`
    <div class="expl ae-expl">
      <div class="ae-label">✦ 추가 해설 (AI)</div>
      ${q.ae}
    </div>`:'';

  const cnCls=isOk?'cn ok':isNg?'cn ng':'cn';
  const cardCls=`card${isOk?' answered-ok':isNg?' answered-ng':''}`;
  const bmCls=bookmarkSet.has(q.n)?'bm-icon on':'bm-icon';
  return `<div class="${cardCls}" id="${id}" data-n="${q.n}">
  <div class="ch">
    <div class="${cnCls}">${q.n}</div>
    <div class="ct">
      <div class="tags">${tags}${atTag}</div>
      <div class="qt">${q.q}</div>
    </div>
    <button class="${bmCls}" onclick="toggleBM(event,${q.n})" title="북마크">⭐</button>
  </div>
  <div class="opts" id="${id}_opts">${optHtml}</div>
  <div class="res-bar ${resShow}" id="${id}_res">
    <div class="ansbar">
      <span class="albl">정답</span>
      <span class="aval">${N[dispAns-1]} ${opts[dispAns-1]}</span>
      <button class="rtbtn" onclick="reset('${id}')">↺ 다시풀기</button>
    </div>
    <div class="expl">${q.e}</div>
    ${aeHtml}
  </div>
</div>`;
}

/* 보기 선택 */
function sel(id,n,dispAns){
  const os=document.querySelectorAll(`#${id}_opts .opt`);
  if(os[0].classList.contains('lk'))return;
  os.forEach(o=>o.classList.add('lk'));
  const qn=parseInt(id.replace('q',''));
  const isCorrect=n===dispAns;

  /* 마지막 푼 문제 기록 */
  lastSeenN=qn;

  /* 시도 기록 */
  if(!attemptMap[qn]) attemptMap[qn]={try:0,ok:0};
  attemptMap[qn].try++;
  if(isCorrect) attemptMap[qn].ok++;
  /* 카드 상단 시도 표시 갱신 */
  const atEl=document.querySelector(`#q${qn} .tg-at`);
  if(atEl){
    const at=attemptMap[qn];
    atEl.textContent=`${at.ok}/${at.try}`;
    atEl.className=`tg tg-at ${atCls(at)}`;
  }

  /* 선택 저장 */
  selectedMap[qn]={sel:n,dispAns};

  if(isCorrect){
    document.getElementById(`${id}_p${n}`).classList.add('cor');
    okSet.add(qn);wrongSet.delete(qn);
    document.getElementById(id).className='card answered-ok';
    document.querySelector(`#${id} .cn`).className='cn ok';
  } else {
    document.getElementById(`${id}_p${n}`).classList.add('wrg');
    document.getElementById(`${id}_p${dispAns}`).classList.add('cor');
    wrongSet.add(qn);okSet.delete(qn);
    document.getElementById(id).className='card answered-ng';
    document.querySelector(`#${id} .cn`).className='cn ng';
  }

  const res=document.getElementById(`${id}_res`);
  res.classList.add('show');
  renderMathInElement(res, KATEX_OPTS);

  upStat();
  saveState();
}

function reset(id){
  const n=parseInt(id.replace('q',''));
  /* 상태 초기화 */
  wrongSet.delete(n); okSet.delete(n); delete selectedMap[n];
  if(shufMode) delete shufMap[id];
  /* DOM 초기화 */
  document.querySelectorAll(`#${id}_opts .opt`).forEach(o=>o.className='opt');
  document.getElementById(`${id}_res`).classList.remove('show');
  document.getElementById(id).className='card';
  document.querySelector(`#${id} .cn`).className='cn';
  document.getElementById(id).style.display='';
  upStat();
  saveState();
  /* 오답 뷰에서 오답이 0개가 되면 전체 뷰로 전환 */
  if(viewMode==='ng' && wrongSet.size===0) setView('all');
}

function resetAll(){
  wrongSet.clear(); okSet.clear();
  shufMap={}; selectedMap={}; randedOrder=null; shufMode=false;
  /* attemptMap·bookmarkSet 유지 */
  viewMode='all'; weakPctActive=null; lastSeenN=null; bmMode=false;
  /* 버튼 초기화 */
  document.getElementById('btnBM').classList.remove('on');
  document.querySelector('#btnWeak .lbl').textContent='자주틀림';
  updateViewBtns('all');
  render(); upStat(); saveState();
}

function toggleMenu(){
  document.getElementById('menuPanel').classList.toggle('open');
  document.getElementById('menuOverlay').classList.toggle('open');
}

function toggleBM(e,n){
  e.stopPropagation();
  const btn=e.currentTarget;
  if(bookmarkSet.has(n)){bookmarkSet.delete(n);btn.classList.remove('on');}
  else{bookmarkSet.add(n);btn.classList.add('on');}
  btn.blur();
  saveState();
  if(viewMode==='bm') setView('bm');
}

function toggleBookmark(b){
  bmMode=!bmMode;
  b.classList.toggle('on', bmMode);
  if(bmMode){
    if(bookmarkSet.size===0){
      alert('북마크한 문제가 없어요! 문제 옆 ★을 눌러 추가하세요.');
      bmMode=false; b.classList.remove('on'); return;
    }
    viewMode='bm'; applyViewFilter('bm');
    updateViewBtns('bm');
  } else {
    viewMode='all'; applyViewFilter('all');
    updateViewBtns('all');
  }
}

function toggleFormulaSheet(){
  const page=document.getElementById('formulaPage');
  const isOpen=page.classList.toggle('open');
  /* 메인 페이지 스크롤 잠금 */
  document.body.style.overflow=isOpen?'hidden':'';
  if(isOpen) renderFormulaSheet();
}

function renderFormulaSheet(){
  const body=document.getElementById('fsBody');
  const items=QS.filter(q=>q.formula);
  if(!items.length){
    body.innerHTML='<div class="fc-empty">등록된 공식이 없어요.<br>QS 데이터에 formula 필드를 추가하세요.</div>';
    return;
  }
  body.innerHTML=items.map(q=>`
    <div class="fc">
      <div class="fc-title">Q${q.n}. ${q.q.replace(/<[^>]*>/g,'').substring(0,40)}${q.q.length>40?'…':''}</div>
      <div class="fc-body">${q.formula}</div>
    </div>
  `).join('');
  renderMathInElement(body, KATEX_OPTS);
}

/* 순서섞기 — 섞인 순서를 유지 */
function doRand(){
  randedOrder = shuf(QS.filter(q=>q.n!=null).map(q=>q.n));
  render();
  setTimeout(()=>{ document.activeElement?.blur(); }, 100);
}
/* 보기섞기 — 순서는 그대로, 보기 배치만 새로 섞기 */
function doShuf(){
  shufMap={}; shufMode=true; render();
  setTimeout(()=>{ document.activeElement?.blur(); }, 100);
}

/* ── 주관식 렌더 ── */
function renderSQ(){
  const wrap=document.getElementById('sq-wrap');
  if(!SQS.length){wrap.style.display='none';return;}
  wrap.innerHTML=`<div class="sq-divider"><span>📝 주관식</span></div>`+SQS.map(s=>{
    if(s.type==='fill'){
      return `<div class="sq-card" id="${s.id}">
  <div class="sq-hd">
    <div class="sq-num">주</div>
    <div><div class="sq-title">${s.title}</div><div class="sq-sub">${s.sub||'빈칸을 채워보세요'}</div></div>
  </div>
  <div class="sq-body">
    <div class="sq-sent">${s.sent}</div>
    <div class="sq-btns">
      <button class="sq-btn-check" onclick="sqCheck('${s.id}')">✓ 채점하기</button>
      <button class="sq-btn-sub" onclick="sqShowAll('${s.id}')">정답 보기</button>
      <button class="sq-btn-sub" onclick="sqReset('${s.id}')">↺ 다시풀기</button>
    </div>
    <div class="sq-score" id="${s.id}_score"></div>
  </div>
</div>`;
    } else {
      return `<div class="sq-card" id="${s.id}">
  <div class="sq-hd">
    <div class="sq-num">주</div>
    <div><div class="sq-title">${s.title}</div><div class="sq-sub">공식을 떠올린 후 정답을 확인하세요</div></div>
  </div>
  <div class="sq-body">
    <div class="sq-formula-box">
      <span style="color:var(--tx3);font-size:.78rem;display:block;margin-bottom:6px;">공식을 써보세요</span>
      <span style="color:var(--ac2);font-size:1.05rem;font-style:italic;">${s.hint}</span>
    </div>
    <button class="sq-show-btn" onclick="sqToggle('${s.id}',this)">🔍 정답 보기</button>
    <div class="sq-ans-box" id="${s.id}_ans">${s.ans}</div>
  </div>
</div>`;
    }
  }).join('');
  /* 번호 순서대로 주N 표시 */
  wrap.querySelectorAll('.sq-num').forEach((el,i)=>el.textContent='주'+(i+1));
  renderMathInElement(wrap, KATEX_OPTS);
}

function sqCheck(id){
  const sc=document.getElementById(`${id}_score`);
  const inps=sc.closest('.sq-body').querySelectorAll('.sq-inp');
  let ok=0;
  inps.forEach(inp=>{
    inp.classList.remove('cor','wrg');
    if(inp.value.trim()===inp.dataset.ans){inp.classList.add('cor');ok++;}
    else inp.classList.add('wrg');
  });
  sc.className='sq-score '+(ok===inps.length?'ok':'ng');
  sc.textContent=ok===inps.length?'🎉 모두 정답!':`${ok} / ${inps.length} 정답 — 틀린 칸을 확인해보세요`;
}
function sqShowAll(id){
  const sc=document.getElementById(`${id}_score`);
  sc.closest('.sq-body').querySelectorAll('.sq-inp').forEach(inp=>{inp.value=inp.dataset.ans;inp.classList.remove('wrg');inp.classList.add('cor');});
  sc.className='sq-score ok';sc.textContent='정답을 확인했습니다 ✓';
}
function sqReset(id){
  const sc=document.getElementById(`${id}_score`);
  sc.closest('.sq-body').querySelectorAll('.sq-inp').forEach(inp=>{inp.value='';inp.classList.remove('cor','wrg');});
  sc.className='sq-score';sc.textContent='';
}
function sqToggle(id,btn){
  const box=document.getElementById(`${id}_ans`);
  const showing=box.classList.toggle('show');
  btn.textContent=showing?'🙈 정답 숨기기':'🔍 정답 보기';
  if(showing) renderMathInElement(box, KATEX_OPTS);
}

/* 터치 기기 :active 고착 방지 — touchend 후 0.1초 뒤 blur */
document.addEventListener('touchend', e=>{
  const btn=e.target.closest('button,.stat-btn');
  if(btn) setTimeout(()=>btn.blur(), 100);
}, {passive:true});

/* 초기화 */
loadState();
render();
renderSQ();

/* 마지막 푼 문제로 스크롤 */
if(lastSeenN){
  requestAnimationFrame(()=>{
    const el=document.getElementById('q'+lastSeenN);
    if(el) el.scrollIntoView({behavior:'instant',block:'center'});
  });
}

/* 맨 위로 버튼 — 화면 높이 2배 이상 스크롤 시 표시 */
window.addEventListener('scroll',()=>{
  const btn=document.getElementById('topBtn');
  btn.classList.toggle('visible', window.scrollY > 300);
},{passive:true});
</script>
</body>
</html>
